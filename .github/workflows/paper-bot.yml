name: paper-bot

on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 min (GitHub puede retrasarlo)
  workflow_dispatch:         # boton "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: paper-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Un ciclo del bot (simulacion)
        run: python bot.py --once

      - name: Generar informe
        run: python report.py > REPORT.txt

      - name: Guardar estado en el repositorio
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add bot.db REPORT.txt
          git diff --staged --quiet && exit 0
          git commit -m "estado $(date -u +%FT%TZ)"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs && git push && exit 0
            sleep 5
          done
          exit 1
